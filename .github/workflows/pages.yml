name: Validate and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish; skip queued ones in between
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate SPA files and profile.json
        run: |
          node -e '
            const fs = require("fs");
            const requiredPaths = ["index.html", "css/styles.css", "js/app.js", "data/profile.json", "media"];
            for (const p of requiredPaths) {
              if (!fs.existsSync(p)) {
                console.error("Missing required path:", p);
                process.exit(1);
              }
            }
            const profile = JSON.parse(fs.readFileSync("data/profile.json", "utf8"));
            for (const key of ["name", "contact", "socials", "mediaItems"]) {
              if (!(key in profile)) {
                console.error("Missing key in data/profile.json:", key);
                process.exit(1);
              }
            }
            console.log("SPA files and data/profile.json validated successfully.");
          '

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v6

      # Publish only what the portfolio SPA needs at runtime
      - name: Collect the runtime files
        run: |
          mkdir -p _site
          cp -r index.html css js data media _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
